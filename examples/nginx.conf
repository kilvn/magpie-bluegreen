# magpie 反向代理配置样例（Nginx / OpenResty）
#
# 核心要点：
# 1. 只需代理 3430 端口（控制台 / 与网关 /v1 同端口）
# 2. 流式输出（SSE）必须关闭缓冲，否则前端会一直卡住直到超时
# 3. 读写超时必须设置足够长（推荐 3600s），长推理任务可能跑几分钟
# 4. 反向代理在宿主机时指向 127.0.0.1:3430；在容器内请指向 docker 网桥网关（如 172.17.0.1:3430）

server {
    listen 80;
    server_name gw.example.com;

    # 证书配置（如果启用了 SSL / 443）
    # ssl_certificate     /etc/ssl/gw.example.com.pem;
    # ssl_certificate_key /etc/ssl/gw.example.com.key;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3430;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # —— 流式三件套，缺一不可 ——
        proxy_buffering off;
        proxy_cache     off;
        gzip            off;

        # 长连接与长推理超时保护
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout       3600s;
    }
}
